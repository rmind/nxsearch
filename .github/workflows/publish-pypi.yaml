name: Build & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual triggers

jobs:
  build_wheels:
    name: Build Python wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64,  runner: ubuntu-24.04 }
          - { os: linux, arch: aarch64, runner: ubuntu-24.04-arm }
          #- { os: macos, arch: x86_64,  runner: macos-15-intel }
          #- { os: macos, arch: arm64,   runner: macos-15 }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: pynxsearch
          config-file: "{package}/pyproject.toml"
        env:
          CIBW_ARCHS: ${{ matrix.arch }}  # native
          #
          # Current defaults are manylinux_2_28 and musllinux_1_2.
          # Override to manylinux_2_34 which uses glibc 2.34 (released in 2021).
          #
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          # CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          # CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          CIBW_BEFORE_ALL_LINUX: |
            uname -a && cc --version
            sh {package}/cibuildwheel.sh {project}
          CIBW_BEFORE_ALL_MACOS: |
            uname -a && cc --version
            MACOSX_DEPLOYMENT_TARGET=11.0
            sh {package}/cibuildwheel.sh {project}

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  #build_sdist:
  #  name: Build source distribution
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/checkout@v6
  #      with:
  #        submodules: 'recursive'
  #    - name: Install uv
  #      uses: astral-sh/setup-uv@v7
  #    - name: Build sdist
  #      run: uv build
  #    - name: Upload sdist as artifact
  #      uses: actions/upload-artifact@v7
  #      with:
  #        name: sdist
  #        path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    #needs: [build_wheels, build_sdist]
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nxsearch
    permissions:
      id-token: write  # mandatory for PyPi's Trusted Publisher
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true  # put all artifacts into dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
